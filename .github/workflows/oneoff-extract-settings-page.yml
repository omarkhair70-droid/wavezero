name: One-off extract Settings page

on:
  push:
    branches:
      - refactor/extract-settings-page
    paths:
      - .github/workflows/oneoff-extract-settings-page.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-settings-page
      - name: Extract Settings page
        run: python3 .github/scripts/extract_settings_page.py
      - name: Remove one-off automation files
        run: rm .github/scripts/extract_settings_page.py .github/workflows/oneoff-extract-settings-page.yml
      - name: Commit extraction
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract Settings page from app orchestrator"
          git push origin HEAD:refactor/extract-settings-page
