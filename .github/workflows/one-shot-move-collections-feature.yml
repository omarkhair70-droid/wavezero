name: One-shot move Collections feature

on:
  push:
    branches:
      - refactor/move-collections-feature

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/move-collections-feature
          fetch-depth: 0
      - name: Move Collections into feature ownership
        shell: bash
        run: |
          python tools/patch_move_collections_feature.py
          rm tools/patch_move_collections_feature.py
          rm .github/workflows/one-shot-move-collections-feature.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move Collections into feature ownership'
          git push origin HEAD:refactor/move-collections-feature
