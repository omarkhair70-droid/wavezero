name: One-shot playback status extraction

on:
  push:
    branches:
      - refactor/extract-playback-status

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-playback-status
          fetch-depth: 0
      - name: Move playback status presentation out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/playback/player_operation_state.dart';\n"
          status_import = "import '../features/playback/playback_status.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('player operation import anchor changed')
          if status_import not in text:
              text = text.replace(import_anchor, import_anchor + status_import, 1)

          start_marker = "  String get _statusText {\n"
          end_marker = "\n\n  @override\n  void initState() {"
          if text.count(start_marker) != 1:
              raise SystemExit('playback status getter start changed')
          start = text.index(start_marker)
          try:
              end = text.index(end_marker, start)
          except ValueError:
              raise SystemExit('playback status getter end changed')
          replacement = (
              "  String get _statusText => WzPlaybackStatusPresentation.headline(\n"
              "        lastError: _lastError,\n"
              "        playbackError: _metrics.playbackError,\n"
              "        operation: _operation,\n"
              "        isPlaying: _metrics.isPlaying,\n"
              "        hasLoadedTrack: _manifest != null || _metrics.trackTitle != null,\n"
              "      );\n\n"
              "  String get _statusDetail => WzPlaybackStatusPresentation.detail(\n"
              "        lastError: _lastError,\n"
              "        playbackError: _metrics.playbackError,\n"
              "        developerMode: _developerMode,\n"
              "        refreshingMetrics: _refreshingMetrics,\n"
              "        upNextTitle: _upNextQueueTrack?.title,\n"
              "        queueStatus: _queueStatus,\n"
              "        consumerError: _friendlyLoadError,\n"
              "      );"
          )
          text = text[:start] + replacement + text[end:]

          if text.count(status_import) != 1:
              raise SystemExit('playback status import missing after patch')
          if "  String get _statusText {\n" in text or "  String get _statusDetail {\n" in text:
              raise SystemExit('inline playback status getters remain')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-playback-status-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-playback-status-extract.yml
          git commit -m "Use extracted playback status presentation"
          git push origin HEAD:refactor/extract-playback-status
