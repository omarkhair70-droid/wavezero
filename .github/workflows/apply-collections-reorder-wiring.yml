name: Apply collection reorder app wiring

on:
  push:
    branches:
      - feat/collections-reorder-20260916
    paths:
      - .github/workflows/apply-collections-reorder-wiring.yml
      - scripts/apply_collections_reorder_wiring.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/collections-reorder-20260916
          fetch-depth: 0
      - name: Apply app wiring
        run: python3 scripts/apply_collections_reorder_wiring.py
      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-collections-reorder-wiring.yml
          git rm scripts/apply_collections_reorder_wiring.py
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git commit -m "Wire collection track reordering"
          git push origin HEAD:feat/collections-reorder-20260916
