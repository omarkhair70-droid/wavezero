name: One-shot recent Search update ordering

on:
  push:
    branches:
      - refactor/extract-recent-searches

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-recent-searches
          fetch-depth: 0
      - name: Preserve state-first recent Search updates
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()
          old = (
              "  Future<void> _rememberSearchQuery(String query) async {\n"
              "    final canonical = canonicalizeWzRecentSearch(query);\n"
              "    if (canonical.isEmpty) return;\n"
              "    final next = await _recentSearchesStore.remember(current: _recentSearches, query: canonical);\n"
              "    if (!mounted) return;\n"
              "    setState(() => _recentSearches = next);\n"
              "  }\n"
          )
          new = (
              "  Future<void> _rememberSearchQuery(String query) async {\n"
              "    final canonical = canonicalizeWzRecentSearch(query);\n"
              "    if (canonical.isEmpty) return;\n"
              "    final next = buildWzRecentSearches(current: _recentSearches, query: canonical);\n"
              "    setState(() => _recentSearches = next);\n"
              "    await _recentSearchesStore.save(next);\n"
              "  }\n"
          )
          if text.count(old) != 1:
              raise SystemExit('recent Search remember integration changed')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm .github/workflows/one-shot-recent-searches-order-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-recent-searches-order-fix.yml
          git commit -m "Preserve recent Search state update order"
          git push origin HEAD:refactor/extract-recent-searches
