name: Apply video audio inbox visibility patch

on:
  push:
    branches:
      - feat/local-video-audio-20260916
    paths:
      - .github/workflows/apply-video-audio-inbox-visibility.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/local-video-audio-20260916
          fetch-depth: 0
      - name: Expose shared inbox writer to local video share activity
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/flutter/wavezero_app/android/app/src/main/kotlin/com/omarkhair/wavezero/WaveZeroShareActivity.kt')
          text = path.read_text()
          old = 'private object WaveZeroImportInbox {'
          new = 'internal object WaveZeroImportInbox {'
          if old not in text:
              raise SystemExit('Expected private WaveZeroImportInbox declaration was not found')
          path.write_text(text.replace(old, new, 1))
      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-video-audio-inbox-visibility.yml
          git add apps/flutter/wavezero_app/android/app/src/main/kotlin/com/omarkhair/wavezero/WaveZeroShareActivity.kt
          git commit -m "Share import inbox writer with video extractor"
          git push origin HEAD:feat/local-video-audio-20260916
