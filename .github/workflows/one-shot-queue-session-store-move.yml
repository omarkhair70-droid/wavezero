name: One-shot Queue session store move

on:
  push:
    branches:
      - refactor/move-queue-session-store

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/move-queue-session-store
          fetch-depth: 0
      - name: Point V3 at Queue session store ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()
          old = "import 'queue_session_store.dart';\n"
          new = "import '../features/queue/queue_session_store.dart';\n"
          if text.count(old) != 1:
              raise SystemExit('Queue session store import anchor changed')
          if new in text:
              raise SystemExit('Queue feature session import already present')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('Queue session store import replacement failed')
          path.write_text(text)
          PY

          rm apps/flutter/wavezero_app/lib/app/queue_session_store.dart
          rm .github/workflows/one-shot-queue-session-store-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart apps/flutter/wavezero_app/lib/app/queue_session_store.dart .github/workflows/one-shot-queue-session-store-move.yml
          git commit -m "Use Queue-owned session store"
          git push origin HEAD:refactor/move-queue-session-store
