name: One-shot extract Library status presentation

on:
  push:
    branches:
      - refactor/extract-library-status-presentation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-library-status-presentation
          fetch-depth: 0
      - name: Move Library status presentation out of V3
        shell: bash
        run: |
          python tools/patch_extract_library_status_presentation.py
          rm tools/patch_extract_library_status_presentation.py
          rm .github/workflows/one-shot-extract-library-status-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Library status presentation from Flutter V3'
          git push origin HEAD:refactor/extract-library-status-presentation
