name: One-shot device history rehydration

on:
  push:
    branches:
      - fix/device-history-rehydration

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/device-history-rehydration
          fetch-depth: 0
      - name: Patch Device Music history rehydration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  CatalogTrackSummary? _resolveHistoryEntry(WzListeningHistoryEntry entry) {\n    for (final track in _libraryTracks) {\n      if (track.trackId == entry.trackId) return track;\n    }\n    return null;\n  }",
              "  CatalogTrackSummary? _resolveHistoryEntry(WzListeningHistoryEntry entry) {\n    for (final track in _libraryTracks) {\n      if (track.trackId == entry.trackId) return track;\n    }\n\n    final restoredDeviceTrack = _findDeviceTrack(entry.trackId);\n    return restoredDeviceTrack == null ? null : _catalogSummaryFromDeviceTrack(restoredDeviceTrack);\n  }",
              'allow persisted Device Music history to resolve before a new scan',
          )

          replace_once(
              "  DeviceMusicTrack? _findDeviceTrack(String? trackId) {\n    if (trackId == null) return null;\n    for (final track in _deviceMusicTracks) {\n      if (track.trackId == trackId) return track;\n    }\n    return null;\n  }",
              "  DeviceMusicTrack? _findDeviceTrack(String? trackId) {\n    if (trackId == null) return null;\n    for (final track in _deviceMusicTracks) {\n      if (track.trackId == trackId) return track;\n    }\n\n    for (final entry in _listeningHistory) {\n      if (entry.trackId != trackId) continue;\n      final restored = _deviceTrackFromHistory(entry);\n      if (restored != null) return restored;\n    }\n    return null;\n  }\n\n  DeviceMusicTrack? _deviceTrackFromHistory(WzListeningHistoryEntry entry) {\n    final contentUri = entry.primaryUrl?.trim();\n    if (entry.source != WzListeningHistorySource.device ||\n        contentUri == null ||\n        contentUri.isEmpty ||\n        !contentUri.startsWith('content://')) {\n      return null;\n    }\n\n    final subtitle = entry.subtitle.trim();\n    return DeviceMusicTrack(\n      trackId: entry.trackId,\n      title: entry.title,\n      contentUri: contentUri,\n      artistName: subtitle.isEmpty || subtitle == 'Device music' ? null : subtitle,\n      albumName: entry.albumName,\n      durationMs: entry.durationMs,\n      codec: entry.codec,\n      artworkUri: entry.artworkUrl,\n    );\n  }",
              'rehydrate Device Music track metadata from persisted history',
          )

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-device-history.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-device-history.yml
          git commit -m "Restore Device Music history without rescanning"
          git push origin HEAD:fix/device-history-rehydration
