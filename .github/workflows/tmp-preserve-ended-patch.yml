name: Temporary preserve-ended patch

on:
  push:
    branches:
      - fix/end-of-track-auto-advance-20260916

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/end-of-track-auto-advance-20260916
          fetch-depth: 0

      - name: Apply preserve-ended patch
        run: python3 tools/tmp_preserve_ended_patch.py

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Preserve explicit playback-ended event'
          git push origin HEAD:fix/end-of-track-auto-advance-20260916
