name: One-shot extract Legal page

on:
  push:
    branches:
      - refactor/extract-legal-page

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-legal-page
          fetch-depth: 0
      - name: Move Legal/Licenses UI out of V3
        shell: bash
        run: |
          python tools/patch_extract_legal_page.py
          rm tools/patch_extract_legal_page.py
          rm .github/workflows/one-shot-extract-legal-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Legal Licenses page from Flutter V3'
          git push origin HEAD:refactor/extract-legal-page
