name: One-shot consumer status cleanup

on:
  push:
    branches:
      - fix/consumer-status-truth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/consumer-status-truth
          fetch-depth: 0
      - name: Patch consumer status truth
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "  bool get _allowManualApiSetup => widget.appConfig.allowManualApiSetup && _developerMode;\n\n  String get _statusText {",
              "  bool get _allowManualApiSetup => widget.appConfig.allowManualApiSetup && _developerMode;\n\n  String get _consumerLibraryHeaderStatus {\n    if (_offlineLibraryAvailable) return 'Offline Ready';\n    if (_deviceMusicTracks.isNotEmpty) return 'Device music ready';\n    if (_catalog.isNotEmpty) return _contentStatus?.friendlyLabel ?? 'Catalog ready';\n\n    final normalized = _catalogStatus.toLowerCase();\n    if (normalized.contains('loading')) return 'Loading library';\n    if (normalized.contains('unavailable') ||\n        normalized.contains('error') ||\n        normalized.contains('exception') ||\n        normalized.contains('failed')) {\n      return 'Catalog unavailable';\n    }\n    return 'Library ready';\n  }\n\n  bool get _consumerLibraryHeaderWarning => _consumerLibraryHeaderStatus == 'Catalog unavailable';\n  bool get _consumerLibraryHeaderActive =>\n      !_consumerLibraryHeaderWarning && _consumerLibraryHeaderStatus != 'Loading library';\n\n  String get _statusText {",
              'add consumer library status getters',
          )

          replace_once(
              "            _lastError = error.toString();\n            _contentStatus = null;\n            _catalog = offlineTracks;",
              "            _lastError = null;\n            _contentStatus = null;\n            _catalog = offlineTracks;",
              'offline catalog fallback must not poison playback status',
          )

          replace_once(
              "            _lastError = error.toString();\n            _catalogStatus = fallbackToDemo ? 'Catalog unavailable. Using local demo track.' : WaveZeroReleaseCopy.catalogUnavailable;",
              "            _lastError = null;\n            _catalogStatus = fallbackToDemo ? 'Catalog unavailable. Using local demo track.' : WaveZeroReleaseCopy.catalogUnavailable;",
              'demo/local fallback must not poison playback status',
          )

          replace_once(
              "                  offlineReady: _offlineLibraryAvailable,\n                  appMode: _appMode,",
              "                  libraryStatus: _consumerLibraryHeaderStatus,\n                  libraryStatusActive: _consumerLibraryHeaderActive,\n                  libraryStatusWarning: _consumerLibraryHeaderWarning,\n                  appMode: _appMode,",
              'wire truthful library state into shell header',
          )

          replace_once(
              "    required this.offlineReady,\n    required this.appMode,",
              "    required this.libraryStatus,\n    required this.libraryStatusActive,\n    required this.libraryStatusWarning,\n    required this.appMode,",
              'update ProductShellHeader constructor',
          )

          replace_once(
              "  final bool offlineReady;\n  final _AppMode appMode;",
              "  final String libraryStatus;\n  final bool libraryStatusActive;\n  final bool libraryStatusWarning;\n  final _AppMode appMode;",
              'update ProductShellHeader fields',
          )

          replace_once(
              "                              : '$selectedTabLabel • ${offlineReady ? 'Offline listening ready' : 'Music library ready'}',",
              "                              : '$selectedTabLabel • $libraryStatus',",
              'use truthful status in header subtitle',
          )

          replace_once(
              "                  WzStatusPill(label: offlineReady ? 'Offline Ready' : 'Catalog ready', active: offlineReady, icon: Icons.offline_pin),",
              "                  WzStatusPill(\n                    label: libraryStatus,\n                    active: libraryStatusActive,\n                    warning: libraryStatusWarning,\n                    icon: libraryStatus == 'Offline Ready'\n                        ? Icons.offline_pin\n                        : libraryStatus == 'Device music ready'\n                            ? Icons.phone_android\n                            : Icons.library_music,\n                  ),",
              'remove hard-coded Catalog ready pill',
          )

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-consumer-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-consumer-status.yml
          git commit -m "Fix consumer library status truth"
          git push origin HEAD:fix/consumer-status-truth
