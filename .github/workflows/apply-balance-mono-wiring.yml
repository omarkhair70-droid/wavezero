name: Apply balance and mono wiring

on:
  push:
    branches:
      - feat/sound-engine-balance-mono-20260916
    paths:
      - scripts/apply_balance_mono_wiring.py
      - .github/workflows/apply-balance-mono-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sound-engine-balance-mono-20260916
          fetch-depth: 0
      - name: Apply channel controls wiring patch
        run: python3 scripts/apply_balance_mono_wiring.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply_balance_mono_wiring.py .github/workflows/apply-balance-mono-wiring.yml
      - name: Commit balance and mono wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire balance and mono channel controls"
          git push origin HEAD:feat/sound-engine-balance-mono-20260916
