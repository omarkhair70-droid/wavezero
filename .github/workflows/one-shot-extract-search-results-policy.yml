name: One-shot extract Search results policy

on:
  push:
    branches:
      - refactor/extract-search-results-policy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-search-results-policy
          fetch-depth: 0
      - name: Move Search result model and policy out of V3
        shell: bash
        run: |
          python tools/patch_extract_search_results_policy.py
          rm tools/patch_extract_search_results_policy.py
          rm .github/workflows/one-shot-extract-search-results-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Search result policy from Flutter V3'
          git push origin HEAD:refactor/extract-search-results-policy
