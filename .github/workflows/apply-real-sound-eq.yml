name: Apply real sound engine EQ wiring

on:
  push:
    branches:
      - feat/real-sound-engine-eq-20260916
    paths:
      - .github/workflows/apply-real-sound-eq.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/real-sound-engine-eq-20260916
          fetch-depth: 0
      - run: python3 scripts/patch_real_sound_eq.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_real_sound_eq.py .github/workflows/apply-real-sound-eq.yml
          git add apps/android/app/src/main/java/com/wavezero/player/playback/AudioPlayerManager.kt
          git add apps/flutter/wavezero_app/android/app/src/main/kotlin/com/omarkhair/wavezero/MainActivity.kt
          git add apps/flutter/wavezero_app/android/app/src/main/AndroidManifest.xml
          git add apps/flutter/wavezero_app/lib/playback/playback_bridge.dart
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git commit -m "Wire real native EQ into playback"
          git push origin HEAD:feat/real-sound-engine-eq-20260916
