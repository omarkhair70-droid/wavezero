name: One-off wire consumer Home
on:
  push:
    branches: [redesign/consumer-wavezero-v1]
    paths:
      - tools/_oneoff_wire_consumer_home.py
      - .github/workflows/_oneoff_wire_consumer_home.yml
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/consumer-wavezero-v1
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python tools/_oneoff_wire_consumer_home.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Wire redesigned consumer Home"
          git push origin HEAD:redesign/consumer-wavezero-v1
