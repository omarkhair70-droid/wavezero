name: One-shot extract Device Music projection

on:
  push:
    branches:
      - refactor/extract-device-music-projection

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-device-music-projection
          fetch-depth: 0
      - name: Extract Device Music projection helpers
        shell: bash
        run: |
          python tools/patch_extract_device_music_projection.py
          rm tools/patch_extract_device_music_projection.py
          rm .github/workflows/one-shot-extract-device-music-projection.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Device Music projection from Flutter V3'
          git push origin HEAD:refactor/extract-device-music-projection
