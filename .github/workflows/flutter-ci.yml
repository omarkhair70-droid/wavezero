name: Flutter CI

on:
  pull_request:
    paths:
      - 'apps/flutter/wavezero_app/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/flutter/wavezero_app/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter:
    name: Flutter analyze, test, and Android build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/flutter/wavezero_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug
