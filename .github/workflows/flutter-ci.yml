name: Flutter CI

on:
  pull_request:
    paths:
      - 'apps/flutter/wavezero_app/**'
      - 'apps/android/app/src/main/java/com/wavezero/player/playback/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/flutter/wavezero_app/**'
      - 'apps/android/app/src/main/java/com/wavezero/player/playback/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter:
    name: Flutter analyze, test, and Android app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter/wavezero_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: RC lockfile capture
        run: cat pubspec.lock

      - name: Upload RC lockfile
        uses: actions/upload-artifact@v4
        with:
          name: wavezero-rc-lockfile
          path: apps/flutter/wavezero_app/pubspec.lock
          if-no-files-found: error

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android release app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=WAVEZERO_APP_ENV=production
          --dart-define=WAVEZERO_API_BASE_URL=https://release-validation.invalid
