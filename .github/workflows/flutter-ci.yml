name: Flutter CI

on:
  pull_request:
    paths:
      - 'apps/flutter/wavezero_app/**'
      - 'apps/android/app/src/main/java/com/wavezero/player/playback/**'
      - '.github/workflows/flutter-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/flutter/wavezero_app/**'
      - 'apps/android/app/src/main/java/com/wavezero/player/playback/**'
      - '.github/workflows/flutter-ci.yml'

jobs:
  flutter:
    name: Flutter analyze, test, and Android app bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/flutter/wavezero_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Android V1 release app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=WAVEZERO_APP_ENV=production
          --dart-define=WAVEZERO_CONTENT_MODE_LABEL="Device music"

      - name: Upload Android V1 RC app bundle
        uses: actions/upload-artifact@v4
        with:
          name: wavezero-v1-rc-aab
          path: apps/flutter/wavezero_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
