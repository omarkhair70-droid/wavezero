name: One-shot Queue position extraction

on:
  push:
    branches:
      - refactor/extract-queue-position-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-queue-position-policy
          fetch-depth: 0
      - name: Move Queue position policy out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/queue/queue_session_store.dart';\n"
          position_import = "import '../features/queue/queue_position.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('Queue session import anchor changed')
          if position_import not in text:
              text = text.replace(import_anchor, import_anchor + position_import, 1)

          old = (
              "  int get _queueIndex {\n"
              "    final id = _queueCurrentTrackId ?? _selectedTrackId;\n"
              "    if (id == null) return -1;\n"
              "    return _queue.indexWhere((track) => track.trackId == id);\n"
              "  }\n\n"
              "  CatalogTrackSummary? get _currentQueueTrack {\n"
              "    final index = _queueIndex;\n"
              "    if (index < 0 || index >= _queue.length) return null;\n"
              "    return _queue[index];\n"
              "  }\n\n"
              "  CatalogTrackSummary? get _upNextQueueTrack {\n"
              "    final index = _queueIndex;\n"
              "    if (index < 0 || index >= _queue.length - 1) return null;\n"
              "    return _queue[index + 1];\n"
              "  }\n\n"
          )
          new = (
              "  WzQueuePosition get _queuePosition => resolveWzQueuePosition(\n"
              "        queue: _queue,\n"
              "        currentTrackId: _queueCurrentTrackId,\n"
              "        selectedTrackId: _selectedTrackId,\n"
              "        shuffleEnabled: _shuffleEnabled,\n"
              "      );\n\n"
              "  int get _queueIndex => _queuePosition.index;\n"
              "  CatalogTrackSummary? get _currentQueueTrack => _queuePosition.currentTrack;\n"
              "  CatalogTrackSummary? get _upNextQueueTrack => _queuePosition.upNextTrack;\n\n"
          )
          if text.count(old) != 1:
              raise SystemExit('Queue position getter block changed')
          text = text.replace(old, new, 1)

          old_controls = (
              "  bool get _canPrevious => _queueIndex > 0;\n"
              "  bool get _canNext => _queueIndex >= 0 && _queueIndex < _queue.length - 1;\n"
              "  bool get _canShuffleNext => _shuffleEnabled && _queue.length > 1 && _queueIndex >= 0;\n"
              "  bool get _canPlayNextControl => _canNext || _canShuffleNext;\n"
          )
          new_controls = (
              "  bool get _canPrevious => _queuePosition.canPrevious;\n"
              "  bool get _canNext => _queuePosition.canNext;\n"
              "  bool get _canShuffleNext => _queuePosition.canShuffleNext;\n"
              "  bool get _canPlayNextControl => _queuePosition.canPlayNext;\n"
          )
          if text.count(old_controls) != 1:
              raise SystemExit('Queue control getter block changed')
          text = text.replace(old_controls, new_controls, 1)

          if text.count(position_import) != 1:
              raise SystemExit('Queue position import missing after patch')
          if "return _queue.indexWhere((track) => track.trackId == id);" in text:
              raise SystemExit('inline Queue position policy remains')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-queue-position-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-queue-position-extract.yml
          git commit -m "Use extracted Queue position policy"
          git push origin HEAD:refactor/extract-queue-position-policy
