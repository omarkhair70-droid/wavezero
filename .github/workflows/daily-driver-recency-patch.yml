name: Apply Daily Driver recency patch

on:
  push:
    branches:
      - feat/daily-driver-polish-20260915
    paths:
      - '.github/workflows/daily-driver-recency-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/daily-driver-polish-20260915

      - name: Apply focused patch
        run: python tooling/apply_daily_driver_recency_patch.py

      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tooling/apply_daily_driver_recency_patch.py .github/workflows/daily-driver-recency-patch.yml
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git commit -m "Add real device recency to Home and Library"
          git push origin HEAD:feat/daily-driver-polish-20260915
