name: One-shot extract theme preferences

on:
  push:
    branches:
      - refactor/extract-theme-preferences

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-theme-preferences
          fetch-depth: 0
      - name: Route app shell through theme preference store
        shell: bash
        run: |
          python tools/patch_extract_theme_preferences.py
          rm tools/patch_extract_theme_preferences.py
          rm .github/workflows/one-shot-extract-theme-preferences.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract theme preferences from Flutter V3'
          git push origin HEAD:refactor/extract-theme-preferences
