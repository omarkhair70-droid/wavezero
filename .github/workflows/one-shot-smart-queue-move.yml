name: One-shot Smart Queue policy move

on:
  push:
    branches:
      - refactor/move-smart-queue-policy

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/move-smart-queue-policy
          fetch-depth: 0
      - name: Point V3 at Queue feature ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()
          old = "import 'smart_queue_policy.dart';\n"
          new = "import '../features/queue/smart_queue_policy.dart';\n"
          if text.count(old) != 1:
              raise SystemExit('Smart Queue policy import anchor changed')
          if new in text:
              raise SystemExit('Queue feature import already present')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('Smart Queue policy import replacement failed')
          path.write_text(text)
          PY

          rm apps/flutter/wavezero_app/lib/app/smart_queue_policy.dart
          rm .github/workflows/one-shot-smart-queue-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart apps/flutter/wavezero_app/lib/app/smart_queue_policy.dart .github/workflows/one-shot-smart-queue-move.yml
          git commit -m "Use Queue-owned Smart Queue policy"
          git push origin HEAD:refactor/move-smart-queue-policy
