name: One-shot extract Collections pages

on:
  push:
    branches:
      - refactor/extract-collections-pages

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-collections-pages
          fetch-depth: 0
      - name: Move Collections UI out of V3
        shell: bash
        run: |
          python tools/patch_extract_collections_pages.py
          rm tools/patch_extract_collections_pages.py
          rm .github/workflows/one-shot-extract-collections-pages.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Collections pages from Flutter V3'
          git push origin HEAD:refactor/extract-collections-pages
