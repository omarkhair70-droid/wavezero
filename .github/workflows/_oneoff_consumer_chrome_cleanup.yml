name: One-off consumer chrome cleanup

on: push

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/consumer-chrome-cleanup
          fetch-depth: 0
      - run: python3 tools/oneoff_consumer_chrome_cleanup.py
      - run: |
          rm .github/workflows/_oneoff_consumer_chrome_cleanup.yml
          rm tools/oneoff_consumer_chrome_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove consumer dashboard chrome"
          git push origin HEAD:product/consumer-chrome-cleanup
