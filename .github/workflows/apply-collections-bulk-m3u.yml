name: Apply Collections 2 bulk and M3U wiring

on:
  push:
    branches:
      - feat/collections-bulk-m3u-20260916
    paths:
      - .github/workflows/apply-collections-bulk-m3u.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/collections-bulk-m3u-20260916
          fetch-depth: 0

      - name: Apply app and Android wiring
        run: python3 scripts/patch_collections_bulk_m3u.py

      - name: Commit wiring and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/patch_collections_bulk_m3u.py .github/workflows/apply-collections-bulk-m3u.yml
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git add apps/flutter/wavezero_app/android/app/src/main/kotlin/com/omarkhair/wavezero/MainActivity.kt
          git commit -m "Wire Collections bulk actions and M3U files"
          git push origin HEAD:feat/collections-bulk-m3u-20260916
