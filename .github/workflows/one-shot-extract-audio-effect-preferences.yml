name: One-shot extract audio effect preferences

on:
  push:
    branches:
      - refactor/extract-audio-effect-preferences

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-audio-effect-preferences
          fetch-depth: 0
      - name: Route V3 through audio effect preference store
        shell: bash
        run: |
          python tools/patch_extract_audio_effect_preferences.py
          rm tools/patch_extract_audio_effect_preferences.py
          rm .github/workflows/one-shot-extract-audio-effect-preferences.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract audio effect preferences from Flutter V3'
          git push origin HEAD:refactor/extract-audio-effect-preferences
