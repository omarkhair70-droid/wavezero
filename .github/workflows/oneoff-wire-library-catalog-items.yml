name: One-off wire Library catalog items

on:
  push:
    branches:
      - refactor/extract-library-catalog-items

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-library-catalog-items
          fetch-depth: 0

      - name: Wire Library catalog items
        run: python tools/wire_library_catalog_items.py

      - name: Remove one-off automation files
        run: |
          rm tools/wire_library_catalog_items.py
          rm .github/workflows/oneoff-wire-library-catalog-items.yml

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "Expected wiring diff was empty"; exit 1; } || true
          git commit -m "Wire Library catalog item presentation"
          git push origin HEAD:refactor/extract-library-catalog-items
