name: One-shot extract shared artwork

on:
  push:
    branches:
      - refactor/extract-shared-artwork

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-shared-artwork
          fetch-depth: 0
      - name: Move shared artwork out of V3
        shell: bash
        run: |
          python tools/patch_extract_shared_artwork.py
          rm tools/patch_extract_shared_artwork.py
          rm .github/workflows/one-shot-extract-shared-artwork.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract shared artwork from Flutter V3'
          git push origin HEAD:refactor/extract-shared-artwork
