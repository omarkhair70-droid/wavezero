name: Play Release
run-name: Play Release • ${{ inputs.track || 'alpha' }} • ${{ github.ref_name }}

on:
  push:
    branches:
      - release/wavezero-alpha-handsfree-20260917
  workflow_dispatch:
    inputs:
      track:
        description: Google Play track
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - production
      confirm_production:
        description: Required only for production releases
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    name: Build signed AAB and publish to Google Play
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/flutter/wavezero_app
    env:
      WAVEZERO_UPLOAD_KEYSTORE_BASE64: ${{ secrets.WAVEZERO_UPLOAD_KEYSTORE_BASE64 }}
      WAVEZERO_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.WAVEZERO_UPLOAD_KEYSTORE_PASSWORD }}
      WAVEZERO_UPLOAD_KEY_PASSWORD: ${{ secrets.WAVEZERO_UPLOAD_KEY_PASSWORD }}
      WAVEZERO_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.WAVEZERO_PLAY_SERVICE_ACCOUNT_JSON }}
      PLAY_TRACK: ${{ inputs.track || 'alpha' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard production release
        if: ${{ env.PLAY_TRACK == 'production' && inputs.confirm_production != true }}
        shell: bash
        run: |
          echo '::error::Production release requires confirm_production=true.'
          exit 1

      - name: Verify release secrets exist
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in \
            WAVEZERO_UPLOAD_KEYSTORE_BASE64 \
            WAVEZERO_UPLOAD_KEYSTORE_PASSWORD \
            WAVEZERO_UPLOAD_KEY_PASSWORD \
            WAVEZERO_PLAY_SERVICE_ACCOUNT_JSON
          do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured in GitHub Actions secrets."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.1'
          cache: true

      - name: Prepare Android upload signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/wavezero-upload-key.jks"
          printf '%s' "$WAVEZERO_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          cat > android/key.properties <<EOF
          storePassword=$WAVEZERO_UPLOAD_KEYSTORE_PASSWORD
          keyPassword=$WAVEZERO_UPLOAD_KEY_PASSWORD
          keyAlias=upload
          storeFile=$KEYSTORE
          EOF

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build signed production AAB
        run: >-
          flutter build appbundle --release
          --dart-define=WAVEZERO_APP_ENV=production
          --dart-define=WAVEZERO_CONTENT_MODE_LABEL="Device music"

      - name: Verify AAB signature
        shell: bash
        run: jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavezero-play-${{ env.PLAY_TRACK }}-aab
          path: apps/flutter/wavezero_app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.WAVEZERO_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.omarkhair.wavezero
          releaseFiles: apps/flutter/wavezero_app/build/app/outputs/bundle/release/app-release.aab
          track: ${{ env.PLAY_TRACK }}
          status: completed
