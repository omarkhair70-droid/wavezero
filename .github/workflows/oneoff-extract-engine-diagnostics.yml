name: One-off extract Engine diagnostics

on:
  push:
    branches:
      - refactor/extract-engine-diagnostics
    paths:
      - .github/workflows/oneoff-extract-engine-diagnostics.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-engine-diagnostics
      - name: Extract Engine diagnostics
        run: python3 .github/scripts/extract_engine_diagnostics.py
      - name: Remove one-off automation files
        run: rm .github/scripts/extract_engine_diagnostics.py .github/workflows/oneoff-extract-engine-diagnostics.yml
      - name: Commit extraction
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract Engine diagnostics from app orchestrator"
          git push origin HEAD:refactor/extract-engine-diagnostics
