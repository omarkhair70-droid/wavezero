name: One-shot Queue mutation extraction

on:
  push:
    branches:
      - refactor/extract-queue-mutations

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-queue-mutations
          fetch-depth: 0
      - name: Move Queue mutation policy out of V3
        shell: bash
        run: |
          python tools/patch_queue_mutations.py
          rm tools/patch_queue_mutations.py
          rm .github/workflows/one-shot-queue-mutations-extract.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart tools/patch_queue_mutations.py .github/workflows/one-shot-queue-mutations-extract.yml
          git commit -m 'Use extracted Queue mutation policy'
          git push origin HEAD:refactor/extract-queue-mutations
