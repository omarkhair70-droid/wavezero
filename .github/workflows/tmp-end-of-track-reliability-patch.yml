name: Temporary end-of-track reliability patch

on:
  push:
    branches:
      - fix/end-of-track-auto-advance-20260916

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/end-of-track-auto-advance-20260916
          fetch-depth: 0

      - name: Apply focused reliability patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, found {count}')
              return text.replace(old, new, 1)

          app_path = Path('apps/flutter/wavezero_app/lib/app/wavezero_app.dart')
          app = app_path.read_text()

          app = replace_once(
              app,
              "import '../features/queue/queue_panel.dart';\n",
              "import '../features/queue/queue_panel.dart';\nimport '../features/queue/playback_context.dart';\n",
              'queue playback-context import',
          )

          helper_marker = "  Future<void> _loadDeviceMusicTrack(\n"
          helper = """  void _adoptPlaybackContextForTrackId(String trackId) {
            if (!mounted ||
                trackId.isEmpty ||
                _queue.any((track) => track.trackId == trackId)) {
              return;
            }

            final context = wzPlaybackContextForTrack(
              preferredTracks: _filteredCatalog,
              fallbackTracks: _resolvableLibraryTracks,
              currentTrackId: trackId,
              maxTracks: _initialVisibleTrackCount,
            );
            if (context.isEmpty) return;

            setState(() {
              _queue = context;
              _queueCurrentTrackId = trackId;
              _queueStatus = 'Playing from your music.';
              _sessionStatus = 'Session saved.';
            });
            unawaited(_saveSession());
            unawaited(_pushNotificationQueueSnapshot());
          }

"""
          app = replace_once(
              app,
              helper_marker,
              helper + helper_marker,
              'playback-context helper insertion',
          )

          old_device = """  Future<void> _loadDeviceMusicTrack(
            DeviceMusicTrack track, {
            bool autoPlay = false,
            PlayerOperation operation = PlayerOperation.loadingTrack,
            String? status,
          }) {
            return _runOperation(operation, () async {
              await _clearNativeNextPrebuffer();
"""
          new_device = """  Future<void> _loadDeviceMusicTrack(
            DeviceMusicTrack track, {
            bool autoPlay = false,
            PlayerOperation operation = PlayerOperation.loadingTrack,
            String? status,
          }) {
            return _runOperation(operation, () async {
              _adoptPlaybackContextForTrackId(track.trackId);
              await _clearNativeNextPrebuffer();
"""
          app = replace_once(app, old_device, new_device, 'device-music playback context')

          app = replace_once(
              app,
              "    if (id == null) return Future<void>.value();\n    final deviceTrack = _findDeviceTrack(id);\n",
              "    if (id == null) return Future<void>.value();\n    _adoptPlaybackContextForTrackId(id);\n    final deviceTrack = _findDeviceTrack(id);\n",
              'catalog playback context',
          )

          old_cloud = """  Future<void> _playCloudVaultTrack(
            CloudVaultTrack track, {
            bool autoPlay = true,
          }) async {
            if (!track.isResolvable) {
"""
          new_cloud = """  Future<void> _playCloudVaultTrack(
            CloudVaultTrack track, {
            bool autoPlay = true,
          }) async {
            _adoptPlaybackContextForTrackId(track.trackId);
            if (!track.isResolvable) {
"""
          app = replace_once(app, old_cloud, new_cloud, 'cloud playback context')

          app = replace_once(
              app,
              "            onSelectTrack: (track) => _loadCatalogTrack(trackId: track.trackId),\n",
              """            onSelectTrack: (track) => _loadCatalogTrack(
              trackId: track.trackId,
              autoPlay: true,
            ),
""",
              'library tap autoplay',
          )

          app = replace_once(
              app,
              "            onPlayTrack: (track) =>\n                _playQueueTrack(track, autoStart: _metrics.isPlaying),\n",
              "            onPlayTrack: (track) =>\n                _playQueueTrack(track, autoStart: true),\n",
              'queue-row tap autoplay',
          )

          app_path.write_text(app)

          metrics_path = Path('apps/android/app/src/main/java/com/wavezero/player/playback/PlaybackMetrics.kt')
          metrics = metrics_path.read_text()
          old_not_playing = """    fun markNotPlaying(positionMs: Long): PlaybackMetrics {
              nativeHandoffStartedAtMs = null
              return update(\"not_playing\") {
                  copy(isPlaying = false, currentPositionMs = positionMs.coerceAtLeast(0))
              }
          }

"""
          new_not_playing = old_not_playing + """    fun markEnded(positionMs: Long): PlaybackMetrics {
              nativeHandoffStartedAtMs = null
              return update(\"playback_ended\") {
                  copy(isPlaying = false, currentPositionMs = positionMs.coerceAtLeast(0))
              }
          }

"""
          metrics = replace_once(
              metrics,
              old_not_playing,
              new_not_playing,
              'explicit playback-ended metrics event',
          )
          metrics_path.write_text(metrics)

          manager_path = Path('apps/android/app/src/main/java/com/wavezero/player/playback/AudioPlayerManager.kt')
          manager = manager_path.read_text()
          old_ended = """                Player.STATE_ENDED -> {
                    playCommandInFlight = false
                    positionJob?.cancel()
                    publish(metricsTracker.markNotPlaying(player.currentPosition))
                    mutablePlaybackState.value = PlaybackState(
"""
          new_ended = """                Player.STATE_ENDED -> {
                    playCommandInFlight = false
                    positionJob?.cancel()
                    publish(metricsTracker.markEnded(player.currentPosition))
                    mutablePlaybackState.value = PlaybackState(
"""
          manager = replace_once(
              manager,
              old_ended,
              new_ended,
              'native STATE_ENDED event',
          )
          manager_path.write_text(manager)

          workflow = Path('.github/workflows/tmp-end-of-track-reliability-patch.yml')
          workflow.unlink()
          PY

      - name: Commit focused patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Fix end-of-track continuity and tap-to-play behavior'
          git push origin HEAD:fix/end-of-track-auto-advance-20260916
