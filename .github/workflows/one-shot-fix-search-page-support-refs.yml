name: One-shot fix Search page support refs

on:
  push:
    branches:
      - refactor/retire-v3-generation-name

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-v3-generation-name
          fetch-depth: 0
      - name: Fix Search page support references
        shell: bash
        run: |
          python tools/fix_search_page_support_refs.py
          rm tools/fix_search_page_support_refs.py
          rm .github/workflows/one-shot-fix-search-page-support-refs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix Search page support references'
          git push origin HEAD:refactor/retire-v3-generation-name
