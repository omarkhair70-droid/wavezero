name: One-shot extract Storage Manager page

on:
  push:
    branches:
      - refactor/extract-storage-manager-page

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-storage-manager-page
          fetch-depth: 0
      - name: Move Storage Manager UI out of V3
        shell: bash
        run: |
          python tools/patch_extract_storage_manager_page.py
          rm tools/patch_extract_storage_manager_page.py
          rm .github/workflows/one-shot-extract-storage-manager-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Storage Manager page from Flutter V3'
          git push origin HEAD:refactor/extract-storage-manager-page
