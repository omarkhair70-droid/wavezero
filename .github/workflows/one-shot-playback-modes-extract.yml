name: One-shot playback modes extraction

on:
  push:
    branches:
      - refactor/extract-playback-modes

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-playback-modes
          fetch-depth: 0
      - name: Move playback mode models out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../playback/test_track.dart';\n"
          modes_import = "import '../features/playback/playback_modes.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('playback import anchor changed')
          if modes_import in text:
              raise SystemExit('playback modes import already present')
          text = text.replace(import_anchor, import_anchor + modes_import, 1)

          start_marker = 'enum WzRepeatMode { off, one, all }\n'
          end_marker = '\n\nString _catalogModeLabel(String? contentMode, int trackCount) {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('playback mode block boundaries changed')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end + 2:]

          if '_SleepTimerPreset' not in text:
              raise SystemExit('expected private sleep timer references missing')
          text = text.replace('_SleepTimerPreset', 'WzSleepTimerPreset')

          if '_SleepTimerPreset' in text:
              raise SystemExit('stale private sleep timer symbol remains')
          if text.count('enum WzRepeatMode') != 0:
              raise SystemExit('repeat enum still declared in V3')
          if modes_import not in text:
              raise SystemExit('playback modes import missing after patch')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-playback-modes-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-playback-modes-extract.yml
          git commit -m "Use extracted playback mode models"
          git push origin HEAD:refactor/extract-playback-modes
