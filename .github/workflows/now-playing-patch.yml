name: Apply Now Playing 2.0 patch

on:
  push:
    branches:
      - feat/now-playing-2-20260915
    paths:
      - '.github/workflows/now-playing-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/now-playing-2-20260915

      - name: Apply focused patch
        run: python tooling/apply_now_playing_2_patch.py

      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tooling/apply_now_playing_2_patch.py .github/workflows/now-playing-patch.yml
          git add apps/flutter/wavezero_app/lib/features/playback/consumer_player.dart
          git add apps/flutter/wavezero_app/lib/shared/widgets/wavezero_artwork.dart
          git add apps/flutter/wavezero_app/test/features/playback/now_playing_interaction_test.dart
          git commit -m "Build Now Playing 2.0 interactions and artwork"
          git push origin HEAD:feat/now-playing-2-20260915
