name: One-off consumer settings wiring

on: push

permissions:
  contents: write

jobs:
  wire-settings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: product/settings-cleanup
          fetch-depth: 0
      - run: python3 tools/oneoff_settings_cleanup.py
      - run: |
          rm .github/workflows/_oneoff_settings_cleanup.yml
          rm tools/oneoff_settings_cleanup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use focused consumer settings surface"
          git push origin HEAD:product/settings-cleanup
