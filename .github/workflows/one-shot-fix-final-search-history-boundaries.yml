name: One-shot fix final Search and History boundaries

on:
  push:
    branches:
      - refactor/retire-v3-generation-name

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/retire-v3-generation-name
          fetch-depth: 0
      - name: Fix extracted Search and History boundaries
        shell: bash
        run: |
          python tools/fix_final_search_history_boundaries.py
          rm tools/fix_final_search_history_boundaries.py
          rm .github/workflows/one-shot-fix-final-search-history-boundaries.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix extracted Search and History boundaries'
          git push origin HEAD:refactor/retire-v3-generation-name
