name: One-shot theme extraction

on:
  push:
    branches:
      - refactor/extract-flutter-theme

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-flutter-theme
          fetch-depth: 0
      - name: Move theme ownership out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import 'smart_queue_policy.dart';\n"
          new_import = "import 'theme/wavezero_theme.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('smart_queue_policy import anchor changed')
          if new_import in text:
              raise SystemExit('theme import already present')
          text = text.replace(import_anchor, import_anchor + new_import, 1)

          start_marker = 'enum WzThemePreset { midnight, oledDark, wavePurple }\n'
          end_marker = '\n\nString _catalogModeLabel(String? contentMode, int trackCount) {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('theme block boundaries changed')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end + 2:]

          if 'class WzThemeConfig' in text or 'enum WzAccentPreset' in text:
              raise SystemExit('theme declarations were not fully removed from V3')
          if new_import not in text:
              raise SystemExit('theme import missing after patch')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-theme-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-theme-extract.yml
          git commit -m "Use extracted WaveZero theme module"
          git push origin HEAD:refactor/extract-flutter-theme
