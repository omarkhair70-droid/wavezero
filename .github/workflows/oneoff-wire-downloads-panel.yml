name: One-off wire Downloads panel

on:
  push:
    branches:
      - refactor/extract-downloads-panel

permissions:
  contents: write

jobs:
  wire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-downloads-panel
          fetch-depth: 0

      - name: Wire Downloads panel
        run: python tools/wire_downloads_panel.py

      - name: Remove one-off automation files
        run: |
          rm tools/wire_downloads_panel.py
          rm .github/workflows/oneoff-wire-downloads-panel.yml

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "Expected wiring diff was empty"; exit 1; } || true
          git commit -m "Wire Downloads consumer panel"
          git push origin HEAD:refactor/extract-downloads-panel
