name: One-shot player operation move

on:
  push:
    branches:
      - refactor/move-player-operation-state

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/move-player-operation-state
          fetch-depth: 0
      - name: Point V3 at playback feature ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()
          old = "import 'player_operation_state.dart';\n"
          new = "import '../features/playback/player_operation_state.dart';\n"
          if text.count(old) != 1:
              raise SystemExit('player operation import anchor changed')
          if new in text:
              raise SystemExit('player operation feature import already present')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('player operation import replacement failed')
          path.write_text(text)
          PY

          rm apps/flutter/wavezero_app/lib/app/player_operation_state.dart
          rm .github/workflows/one-shot-player-operation-move.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart apps/flutter/wavezero_app/lib/app/player_operation_state.dart .github/workflows/one-shot-player-operation-move.yml
          git commit -m "Use playback-owned player operation state"
          git push origin HEAD:refactor/move-player-operation-state
