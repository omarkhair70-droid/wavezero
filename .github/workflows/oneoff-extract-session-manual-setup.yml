name: One-off extract session and manual setup

on:
  push:
    branches:
      - refactor/extract-session-manual-setup
    paths:
      - .github/workflows/oneoff-extract-session-manual-setup.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-session-manual-setup
      - name: Extract session and manual setup
        run: python3 .github/scripts/extract_session_manual_setup.py
      - name: Remove one-off automation files
        run: rm .github/scripts/extract_session_manual_setup.py .github/workflows/oneoff-extract-session-manual-setup.yml
      - name: Commit extraction
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Extract session and manual setup presentation"
          git push origin HEAD:refactor/extract-session-manual-setup
