name: One-shot product shell header extraction

on:
  push:
    branches:
      - refactor/extract-product-shell-header

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-product-shell-header
          fetch-depth: 0
      - name: Move product header out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import 'app_config.dart';\n"
          shell_import = "import 'app_shell/wavezero_product_header.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('app_config import anchor changed')
          if shell_import in text:
              raise SystemExit('product shell header import already present')
          text = text.replace(import_anchor, import_anchor + shell_import, 1)

          if text.count('_ProductShellHeader(') != 2:
              raise SystemExit(f'expected constructor declaration + one call, found {text.count("_ProductShellHeader(")}')
          text = text.replace('_ProductShellHeader(', 'WaveZeroProductHeader(', 1)

          start_marker = 'class _ProductShellHeader extends StatelessWidget {'
          end_marker = '\n\nclass _HomeHero extends StatelessWidget {'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise SystemExit('product header block boundaries changed')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end + 2:]

          if '_ProductShellHeader' in text:
              raise SystemExit('stale private product header remains')
          if text.count('WaveZeroProductHeader(') != 1:
              raise SystemExit(f'expected one extracted header call, found {text.count("WaveZeroProductHeader(")}')
          if shell_import not in text:
              raise SystemExit('product shell header import missing after patch')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-product-header-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-product-header-extract.yml
          git commit -m "Use extracted WaveZero product header"
          git push origin HEAD:refactor/extract-product-shell-header
