name: One-shot auto-advance trigger extraction

on:
  push:
    branches:
      - refactor/extract-auto-advance-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auto-advance-trigger
          fetch-depth: 0
      - name: Move auto-advance trigger policy out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/playback/playback_modes.dart';\n"
          trigger_import = "import '../features/playback/auto_advance_trigger.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('playback modes import anchor changed')
          if trigger_import not in text:
              text = text.replace(import_anchor, trigger_import + import_anchor, 1)

          old = (
              "  Future<void> _maybeAutoAdvance(PlaybackMetrics metrics) async {\n"
              "    if (!_autoAdvanceEnabled || _operation != PlayerOperation.idle) return;\n"
              "    final durationMs = metrics.durationMs ?? _manifest?.durationMs;\n"
              "    if (durationMs == null || durationMs <= 0) return;\n"
              "    final remainingMs = durationMs - metrics.currentPositionMs;\n"
              "    final nearEnd = metrics.currentPositionMs > 0 && remainingMs <= _autoAdvanceThresholdMs;\n"
              "    final ended = metrics.lastEvent == 'ended' || metrics.lastEvent == 'playback_ended';\n"
              "    if (!nearEnd && !ended) {\n"
              "      if (metrics.currentPositionMs < durationMs - (_autoAdvanceThresholdMs * 2)) _lastAutoAdvanceTrackId = null;\n"
              "      return;\n"
              "    }\n"
              "    final id = _currentQueueTrack?.trackId ?? _queueCurrentTrackId ?? _selectedTrackId;\n"
              "    if (id == null || id == _lastAutoAdvanceTrackId) return;\n"
              "    _lastAutoAdvanceTrackId = id;\n\n"
              "    if (_repeatMode == WzRepeatMode.one) {\n"
          )
          new = (
              "  Future<void> _maybeAutoAdvance(PlaybackMetrics metrics) async {\n"
              "    final trigger = evaluateWzAutoAdvanceTrigger(\n"
              "      enabled: _autoAdvanceEnabled,\n"
              "      operation: _operation,\n"
              "      currentPositionMs: metrics.currentPositionMs,\n"
              "      metricsDurationMs: metrics.durationMs,\n"
              "      manifestDurationMs: _manifest?.durationMs,\n"
              "      lastEvent: metrics.lastEvent,\n"
              "      currentTrackId: _currentQueueTrack?.trackId ?? _queueCurrentTrackId ?? _selectedTrackId,\n"
              "      lastAutoAdvanceTrackId: _lastAutoAdvanceTrackId,\n"
              "      thresholdMs: _autoAdvanceThresholdMs,\n"
              "    );\n"
              "    if (trigger.clearLastTrackGuard) _lastAutoAdvanceTrackId = null;\n"
              "    if (!trigger.shouldAdvance) return;\n"
              "    _lastAutoAdvanceTrackId = trigger.trackId;\n\n"
              "    if (_repeatMode == WzRepeatMode.one) {\n"
          )
          if text.count(old) != 1:
              raise SystemExit('auto-advance trigger block changed')
          text = text.replace(old, new, 1)

          if text.count(trigger_import) != 1:
              raise SystemExit('auto-advance trigger import missing after patch')
          if "final remainingMs = durationMs - metrics.currentPositionMs;" in text:
              raise SystemExit('inline auto-advance threshold logic remains')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-auto-advance-trigger-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-auto-advance-trigger-extract.yml
          git commit -m "Use extracted auto-advance trigger policy"
          git push origin HEAD:refactor/extract-auto-advance-trigger
