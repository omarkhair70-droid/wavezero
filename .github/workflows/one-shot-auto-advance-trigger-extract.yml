name: One-shot auto-advance trigger extraction

on:
  push:
    branches:
      - refactor/extract-auto-advance-trigger

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-auto-advance-trigger
          fetch-depth: 0
      - name: Move auto-advance trigger policy out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/playback/playback_modes.dart';\n"
          trigger_import = "import '../features/playback/auto_advance_trigger.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('playback modes import anchor changed')
          if trigger_import not in text:
              text = text.replace(import_anchor, trigger_import + import_anchor, 1)

          old = """  Future<void> _maybeAutoAdvance(PlaybackMetrics metrics) async {
    if (!_autoAdvanceEnabled || _operation != PlayerOperation.idle) return;
    final durationMs = metrics.durationMs ?? _manifest?.durationMs;
    if (durationMs == null || durationMs <= 0) return;
    final remainingMs = durationMs - metrics.currentPositionMs;
    final nearEnd = metrics.currentPositionMs > 0 && remainingMs <= _autoAdvanceThresholdMs;
    final ended = metrics.lastEvent == 'ended' || metrics.lastEvent == 'playback_ended';
    if (!nearEnd && !ended) {
      if (metrics.currentPositionMs < durationMs - (_autoAdvanceThresholdMs * 2)) _lastAutoAdvanceTrackId = null;
      return;
    }
    final id = _currentQueueTrack?.trackId ?? _queueCurrentTrackId ?? _selectedTrackId;
    if (id == null || id == _lastAutoAdvanceTrackId) return;
    _lastAutoAdvanceTrackId = id;

    if (_repeatMode == WzRepeatMode.one) {
"""
          new = """  Future<void> _maybeAutoAdvance(PlaybackMetrics metrics) async {
    final trigger = evaluateWzAutoAdvanceTrigger(
      enabled: _autoAdvanceEnabled,
      operation: _operation,
      currentPositionMs: metrics.currentPositionMs,
      metricsDurationMs: metrics.durationMs,
      manifestDurationMs: _manifest?.durationMs,
      lastEvent: metrics.lastEvent,
      currentTrackId: _currentQueueTrack?.trackId ?? _queueCurrentTrackId ?? _selectedTrackId,
      lastAutoAdvanceTrackId: _lastAutoAdvanceTrackId,
      thresholdMs: _autoAdvanceThresholdMs,
    );
    if (trigger.clearLastTrackGuard) _lastAutoAdvanceTrackId = null;
    if (!trigger.shouldAdvance) return;
    _lastAutoAdvanceTrackId = trigger.trackId;

    if (_repeatMode == WzRepeatMode.one) {
"""
          if text.count(old) != 1:
              raise SystemExit('auto-advance trigger block changed')
          text = text.replace(old, new, 1)

          if text.count(trigger_import) != 1:
              raise SystemExit('auto-advance trigger import missing after patch')
          if "final remainingMs = durationMs - metrics.currentPositionMs;" in text:
              raise SystemExit('inline auto-advance threshold logic remains')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-auto-advance-trigger-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-auto-advance-trigger-extract.yml
          git commit -m "Use extracted auto-advance trigger policy"
          git push origin HEAD:refactor/extract-auto-advance-trigger
