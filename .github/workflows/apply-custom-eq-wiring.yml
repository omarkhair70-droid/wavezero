name: Apply custom EQ wiring

on:
  push:
    branches:
      - feat/sound-engine-custom-eq-20260916
    paths:
      - scripts/apply_custom_eq_wiring.py
      - .github/workflows/apply-custom-eq-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sound-engine-custom-eq-20260916
          fetch-depth: 0
      - name: Apply wiring patch
        run: python3 scripts/apply_custom_eq_wiring.py
      - name: Remove one-shot patch files
        run: git rm scripts/apply_custom_eq_wiring.py .github/workflows/apply-custom-eq-wiring.yml
      - name: Commit custom EQ wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire custom EQ into playback settings"
          git push origin HEAD:feat/sound-engine-custom-eq-20260916
