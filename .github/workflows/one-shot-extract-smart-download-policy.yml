name: One-shot extract Smart Downloads policy

on:
  push:
    branches:
      - refactor/extract-smart-download-policy

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-smart-download-policy
          fetch-depth: 0
      - name: Route V3 through Smart Downloads policy
        shell: bash
        run: |
          python tools/patch_extract_smart_download_policy.py
          rm tools/patch_extract_smart_download_policy.py
          rm .github/workflows/one-shot-extract-smart-download-policy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Smart Downloads policy from Flutter V3'
          git push origin HEAD:refactor/extract-smart-download-policy
