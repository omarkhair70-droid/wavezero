name: Apply Downloads 2 app wiring

on:
  push:
    branches:
      - feat/downloads-2-20260916
    paths:
      - .github/workflows/apply-downloads-2-app-wiring.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/downloads-2-20260916
          fetch-depth: 0
      - name: Wire Device Music handoff into Downloads tab
        shell: python
        run: |
          from pathlib import Path
          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_app.dart')
          text = path.read_text()
          needle = '            onManageStorage: () => _navigateTo(WzAppTab.storage),'
          replacement = '''            onManageStorage: () => _navigateTo(WzAppTab.storage),
            onRefreshDeviceMusic: _importDeviceMusic,
            onOpenDeviceMusic: () {
              setState(() => _librarySourceFilter = WzLibrarySourceFilter.device);
              _navigateTo(WzAppTab.library);
            },'''
          index = text.find(needle)
          if index < 0:
              raise SystemExit('Expected Downloads onManageStorage callback was not found')
          path.write_text(text[:index] + replacement + text[index + len(needle):])
      - name: Commit patch and remove one-shot tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-downloads-2-app-wiring.yml
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git commit -m "Wire direct downloads to Device Music"
          git push origin HEAD:feat/downloads-2-20260916
