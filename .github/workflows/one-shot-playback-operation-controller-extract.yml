name: One-shot playback operation controller extraction

on:
  push:
    branches:
      - refactor/extract-playback-operation-controller

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-playback-operation-controller
          fetch-depth: 0
      - name: Move playback operation admission out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/playback/player_operation_state.dart';\n"
          controller_import = "import '../features/playback/playback_operation_controller.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('player operation state import anchor changed')
          if controller_import not in text:
              text = text.replace(import_anchor, controller_import + import_anchor, 1)

          old_field = "  PlayerOperation _operation = PlayerOperation.idle;\n"
          new_field = (
              "  final WzPlaybackOperationController _operationController = WzPlaybackOperationController();\n"
              "  PlayerOperation get _operation => _operationController.current;\n"
          )
          if text.count(old_field) != 1:
              raise SystemExit('player operation field changed')
          text = text.replace(old_field, new_field, 1)

          old_import_begin = (
              "  Future<void> _importDeviceMusic() async {\n"
              "    if (_operation != PlayerOperation.idle) return;\n"
              "    setState(() {\n"
              "      _operation = PlayerOperation.loadingCatalog;\n"
          )
          new_import_begin = (
              "  Future<void> _importDeviceMusic() async {\n"
              "    if (!_operationController.tryBegin(PlayerOperation.loadingCatalog)) return;\n"
              "    setState(() {\n"
          )
          if text.count(old_import_begin) != 1:
              raise SystemExit('device music operation begin changed')
          text = text.replace(old_import_begin, new_import_begin, 1)

          old_run = (
              "  Future<void> _runOperation(PlayerOperation operation, Future<void> Function() body, {bool refreshAfter = true}) async {\n"
              "    if (_operation != PlayerOperation.idle) return;\n"
              "    setState(() {\n"
              "      _operation = operation;\n"
              "      _lastError = null;\n"
              "    });\n"
              "    try {\n"
              "      await body();\n"
              "      if (refreshAfter) await _refreshMetrics(allowAutoAdvance: false);\n"
              "    } catch (error) {\n"
              "      if (mounted) setState(() => _lastError = error.toString());\n"
              "    } finally {\n"
              "      if (mounted) setState(() => _operation = PlayerOperation.idle);\n"
              "    }\n"
              "  }\n"
          )
          new_run = (
              "  Future<void> _runOperation(PlayerOperation operation, Future<void> Function() body, {bool refreshAfter = true}) async {\n"
              "    if (!_operationController.tryBegin(operation)) return;\n"
              "    setState(() => _lastError = null);\n"
              "    try {\n"
              "      await body();\n"
              "      if (refreshAfter) await _refreshMetrics(allowAutoAdvance: false);\n"
              "    } catch (error) {\n"
              "      if (mounted) setState(() => _lastError = error.toString());\n"
              "    } finally {\n"
              "      if (mounted) setState(_operationController.end);\n"
              "    }\n"
              "  }\n"
          )
          if text.count(old_run) != 1:
              raise SystemExit('run operation block changed')
          text = text.replace(old_run, new_run, 1)

          toggle_assign = "    setState(() => _operation = PlayerOperation.loadingTrack);\n"
          if text.count(toggle_assign) != 1:
              raise SystemExit(f'expected one manual loadingTrack assignment, found {text.count(toggle_assign)}')
          text = text.replace(
              toggle_assign,
              "    if (!_operationController.tryBegin(PlayerOperation.loadingTrack)) return;\n    setState(() {});\n",
              1,
          )

          catalog_assign = "    setState(() => _operation = PlayerOperation.loadingCatalog);\n"
          if text.count(catalog_assign) != 2:
              raise SystemExit(f'expected two manual loadingCatalog assignments, found {text.count(catalog_assign)}')
          text = text.replace(
              catalog_assign,
              "    if (!_operationController.tryBegin(PlayerOperation.loadingCatalog)) return;\n    setState(() {});\n",
          )

          old_end = "      if (mounted) setState(() => _operation = PlayerOperation.idle);\n"
          if text.count(old_end) != 4:
              raise SystemExit(f'expected four remaining manual operation endings, found {text.count(old_end)}')
          text = text.replace(old_end, "      if (mounted) setState(_operationController.end);\n")

          if text.count(controller_import) != 1:
              raise SystemExit('operation controller import missing after patch')
          for stale in (
              "PlayerOperation _operation = PlayerOperation.idle;",
              "_operation = PlayerOperation.loadingCatalog",
              "_operation = PlayerOperation.loadingTrack",
              "_operation = operation",
              "_operation = PlayerOperation.idle",
          ):
              if stale in text:
                  raise SystemExit(f'direct operation assignment remains: {stale}')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-playback-operation-controller-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-playback-operation-controller-extract.yml
          git commit -m "Use playback operation controller"
          git push origin HEAD:refactor/extract-playback-operation-controller
