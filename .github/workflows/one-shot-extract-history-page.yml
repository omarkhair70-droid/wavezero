name: One-shot extract History page

on:
  push:
    branches:
      - refactor/extract-history-page

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-history-page
          fetch-depth: 0
      - name: Move Listening History UI out of V3
        shell: bash
        run: |
          python tools/patch_extract_history_page.py
          rm tools/patch_extract_history_page.py
          rm .github/workflows/one-shot-extract-history-page.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Listening History page from Flutter V3'
          git push origin HEAD:refactor/extract-history-page
