name: One-off wire Porcelain shell

on:
  push:
    branches:
      - redesign/porcelain-wavezero-shell
    paths:
      - .github/workflows/oneoff-porcelain-shell.yml

permissions:
  contents: write

jobs:
  wire-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redesign/porcelain-wavezero-shell
          fetch-depth: 0
      - name: Wire sculpted bottom shell
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_app.dart')
          text = path.read_text()

          import_old = "import 'app_shell/wavezero_product_header.dart';\n"
          import_new = "import 'app_shell/wavezero_product_header.dart';\nimport 'app_shell/wavezero_bottom_navigation.dart';\n"
          if text.count(import_old) != 1:
              raise SystemExit(f'Expected product header import once, found {text.count(import_old)}')
          text = text.replace(import_old, import_new, 1)

          barrier_old = "barrierColor: Colors.black.withOpacity(0.62),"
          barrier_new = "barrierColor: const Color(0x66788792),"
          if text.count(barrier_old) != 1:
              raise SystemExit(f'Expected legacy player barrier once, found {text.count(barrier_old)}')
          text = text.replace(barrier_old, barrier_new, 1)

          old = '''      bottomNavigationBar: Container(
        color: widget.themeConfig.surfaceMuted,
        child: Column(
          mainAxisSize: MainAxisSize.min,
          children: [
            if (hasPlayerTrack) ...[
              Padding(
                padding: const EdgeInsets.fromLTRB(10, 8, 10, 6),
                child: WzPremiumMiniPlayer(
                  metrics: _metrics,
                  manifest: _manifest,
                  progressValue: progress,
                  sourceLabel: isDevicePlayback ? 'Device music' : wzPlayerSourceLabel(isPlayingFromCache: isPlayingFromCache, offlineReady: _offlineLibraryAvailable, hasTrack: hasPlayerTrack),
                  offlineReady: _offlineLibraryAvailable,
                  shuffleEnabled: _shuffleEnabled,
                  repeatMode: _repeatMode,
                  sleepTimerBadge: _sleepTimerDeadline == null ? null : _sleepTimerStatusLabel,
                  controlsDisabled: _playerDisabled,
                  onTap: _showPremiumPlayerSheet,
                  onPlayPause: _playPause,
                ),
              ),
              const Divider(height: 1, color: WzColors.border),
            ],
            BottomNavigationBar(
              currentIndex: currentIndex < 0 ? 0 : currentIndex,
              onTap: (i) => _navigateTo(destinations[i].tab),
              backgroundColor: widget.themeConfig.surfaceMuted,
              selectedItemColor: currentIndex < 0 ? WzColors.textMuted : widget.themeConfig.accent,
              unselectedItemColor: WzColors.textMuted,
              type: BottomNavigationBarType.fixed,
              items: destinations.map((destination) => BottomNavigationBarItem(icon: Icon(destination.icon), label: destination.label)).toList(growable: false),
            ),
          ],
        ),
      ),'''
          new = '''      bottomNavigationBar: WaveZeroBottomShell(
        destinations: destinations,
        currentIndex: currentIndex < 0 ? 0 : currentIndex,
        onDestinationSelected: (i) => _navigateTo(destinations[i].tab),
        accent: widget.themeConfig.accent,
        miniPlayer: hasPlayerTrack
            ? WzPremiumMiniPlayer(
                metrics: _metrics,
                manifest: _manifest,
                progressValue: progress,
                sourceLabel: isDevicePlayback ? 'Device music' : wzPlayerSourceLabel(isPlayingFromCache: isPlayingFromCache, offlineReady: _offlineLibraryAvailable, hasTrack: hasPlayerTrack),
                offlineReady: _offlineLibraryAvailable,
                shuffleEnabled: _shuffleEnabled,
                repeatMode: _repeatMode,
                sleepTimerBadge: _sleepTimerDeadline == null ? null : _sleepTimerStatusLabel,
                controlsDisabled: _playerDisabled,
                onTap: _showPremiumPlayerSheet,
                onPlayPause: _playPause,
              )
            : null,
      ),'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected legacy bottom navigation block once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          git diff --check
          git diff -- apps/flutter/wavezero_app/lib/app/wavezero_app.dart
      - name: Commit guarded shell wiring
        shell: bash
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git rm .github/workflows/oneoff-porcelain-shell.yml
          git add apps/flutter/wavezero_app/lib/app/wavezero_app.dart
          git commit -m "Wire Porcelain player shell and navigation"
          git push origin HEAD:redesign/porcelain-wavezero-shell
