name: One-shot extract History resolution and presentation

on:
  push:
    branches:
      - refactor/extract-history-resolution-presentation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-history-resolution-presentation
          fetch-depth: 0
      - name: Route V3 through History resolution and presentation policy
        shell: bash
        run: |
          python tools/patch_extract_history_resolution_presentation.py
          rm tools/patch_extract_history_resolution_presentation.py
          rm .github/workflows/one-shot-extract-history-resolution-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract History resolution and presentation from Flutter V3'
          git push origin HEAD:refactor/extract-history-resolution-presentation
