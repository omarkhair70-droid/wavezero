name: One-off remove dead Home UI

on:
  push:
    branches:
      - refactor/remove-dead-home-legacy-ui

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/remove-dead-home-legacy-ui
          fetch-depth: 0

      - name: Remove dead legacy Home presentation
        run: python tools/remove_dead_home_legacy.py

      - name: Remove one-off automation files
        run: |
          rm tools/remove_dead_home_legacy.py
          rm .github/workflows/oneoff-remove-dead-home.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --exit-code && { echo "Expected cleanup diff was empty"; exit 1; } || true
          git commit -m "Remove dead legacy Home presentation"
          git push origin HEAD:refactor/remove-dead-home-legacy-ui
