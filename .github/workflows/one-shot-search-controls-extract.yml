name: One-shot search controls extraction

on:
  push:
    branches:
      - refactor/extract-search-controls

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-search-controls
          fetch-depth: 0
      - name: Move search filter vocabulary out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/library/library_controls.dart';\n"
          search_import = "import '../features/search/search_controls.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('library controls import anchor changed')
          if search_import not in text:
              text = text.replace(import_anchor, import_anchor + search_import, 1)

          block_start = 'enum _SearchFilter { all, songs, device, downloads, cloud, collections, history, legalDemo }'
          block_end = 'class WzSearchResult {'
          if text.count(block_start) != 1 or text.count(block_end) != 1:
              raise SystemExit('search filter block boundaries changed')
          start = text.index(block_start)
          end = text.index(block_end, start)
          text = text[:start] + text[end:]

          if '_SearchFilter' not in text:
              raise SystemExit('expected search filter references missing')
          text = text.replace('_SearchFilter', 'WzSearchFilter')

          if '_SearchFilter' in text:
              raise SystemExit('stale search filter symbol remains')
          if text.count(search_import) != 1:
              raise SystemExit('search controls import missing after patch')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-search-controls-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-search-controls-extract.yml
          git commit -m "Use extracted search filter controls"
          git push origin HEAD:refactor/extract-search-controls
