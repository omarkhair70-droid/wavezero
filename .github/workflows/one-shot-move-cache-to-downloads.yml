name: One-shot move CacheService to Downloads

on:
  push:
    branches:
      - refactor/move-cache-service-to-downloads

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/move-cache-service-to-downloads
          fetch-depth: 0
      - name: Move CacheService into Downloads feature
        shell: bash
        run: |
          python tools/patch_move_cache_to_downloads.py
          rm tools/patch_move_cache_to_downloads.py
          rm .github/workflows/one-shot-move-cache-to-downloads.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Move CacheService into Downloads feature'
          git push origin HEAD:refactor/move-cache-service-to-downloads
