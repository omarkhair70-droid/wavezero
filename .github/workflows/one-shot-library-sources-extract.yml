name: One-shot Library source extraction

on:
  push:
    branches:
      - refactor/extract-library-source-composition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-library-source-composition
          fetch-depth: 0
      - name: Move Library source composition out of V3
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart')
          text = path.read_text()

          import_anchor = "import '../features/library/library_sort.dart';\n"
          sources_import = "import '../features/library/library_sources.dart';\n"
          if text.count(import_anchor) != 1:
              raise SystemExit('library sort import anchor changed')
          if sources_import not in text:
              text = text.replace(import_anchor, import_anchor + sources_import, 1)

          old = (
              "  List<CatalogTrackSummary> get _libraryTracks {\n"
              "    return switch (_librarySourceFilter) {\n"
              "      WzLibrarySourceFilter.all => [..._catalog, ..._deviceCatalogTracks, ..._cachedCatalogTracks, ..._cloudCatalogTracks],\n"
              "      WzLibrarySourceFilter.api => _catalog,\n"
              "      WzLibrarySourceFilter.device => _deviceCatalogTracks,\n"
              "      WzLibrarySourceFilter.downloads => _cachedCatalogTracks,\n"
              "      WzLibrarySourceFilter.cloud => _cloudCatalogTracks,\n"
              "    };\n"
              "  }\n"
          )
          new = (
              "  List<CatalogTrackSummary> get _libraryTracks => composeWzLibraryTracks(\n"
              "        filter: _librarySourceFilter,\n"
              "        catalogTracks: _catalog,\n"
              "        deviceTracks: _deviceCatalogTracks,\n"
              "        downloadedTracks: _cachedCatalogTracks,\n"
              "        cloudTracks: _cloudCatalogTracks,\n"
              "      );\n"
          )
          if text.count(old) != 1:
              raise SystemExit('Library source composition block changed')
          text = text.replace(old, new, 1)

          if text.count(sources_import) != 1:
              raise SystemExit('Library source import missing after patch')
          if "return switch (_librarySourceFilter)" in text:
              raise SystemExit('inline Library source composition remains')

          path.write_text(text)
          PY

          rm .github/workflows/one-shot-library-sources-extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/flutter/wavezero_app/lib/app/wavezero_live_metrics_app_v3.dart .github/workflows/one-shot-library-sources-extract.yml
          git commit -m "Use extracted Library source composition"
          git push origin HEAD:refactor/extract-library-source-composition
