name: One-off fix Engine diagnostics exports

on:
  push:
    branches:
      - refactor/extract-engine-diagnostics
    paths:
      - .github/workflows/oneoff-fix-engine-diagnostics-exports.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-engine-diagnostics
      - name: Export reusable diagnostics
        run: python3 .github/scripts/fix_engine_diagnostics_exports.py
      - name: Remove one-off automation files
        run: rm .github/scripts/fix_engine_diagnostics_exports.py .github/workflows/oneoff-fix-engine-diagnostics-exports.yml
      - name: Commit fix
        run: |
          git config user.name "omarkhair70-droid"
          git config user.email "omar.khair70@gmail.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Export reusable developer diagnostics"
          git push origin HEAD:refactor/extract-engine-diagnostics
