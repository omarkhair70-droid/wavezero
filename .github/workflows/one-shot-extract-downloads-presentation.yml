name: One-shot extract Downloads presentation

on:
  push:
    branches:
      - refactor/extract-downloads-presentation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/extract-downloads-presentation
          fetch-depth: 0
      - name: Extract Downloads presentation and projection helpers
        shell: bash
        run: |
          python tools/patch_extract_downloads_presentation.py
          rm tools/patch_extract_downloads_presentation.py
          rm .github/workflows/one-shot-extract-downloads-presentation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Extract Downloads presentation from Flutter V3'
          git push origin HEAD:refactor/extract-downloads-presentation
